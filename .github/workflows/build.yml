name: release-os-artifact

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: python -m pip install -r dev-requirements.txt
      - name: 安装 NSIS（仅 Windows）
        if: matrix.target == 'windows'
        run: choco install nsis -y --no-progress
      - name: 打包
        env:
          PYTHONIOENCODING: utf-8
        run: python tools/package.py --target ${{ matrix.target }}
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: WisePet-${{ matrix.target }}-${{ github.ref_name }}
          path: dist/WisePet-*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    # 修改这里：允许手动触发(workflow_dispatch) 或 推送标签(push tags)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          pattern: WisePet-*
          merge-multiple: true
          path: dist/

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/WisePet-*
          draft: false
          prerelease: false


