name: release-os-artifact

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: python -m pip install -r dev-requirements.txt
      - name: 安装 NSIS（仅 Windows）
        if: matrix.target == 'windows'
        run: choco install nsis -y --no-progress
      - name: 导入 macOS 签名证书（仅当用户配置了 secret）
        # GitHub Actions 的 if: 不允许引用 secrets context（只允许
        # github/needs/strategy/matrix/job/runner/env/vars/steps/inputs）。
        # 所以「有没有证书」放到 shell 里判断：if: 只用 matrix，绝对安全。
        if: matrix.target == 'macos'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ]; then
            echo "未配置 MACOS_CERTIFICATE，跳过证书导入，走未签名 dmg 路径"
            exit 0
          fi
          # macOS 自带的是 BSD base64，不支持 GNU 的 --decode；用 Python 解码最稳
          python -c "import base64, os; open('/tmp/wisepet-cert.p12','wb').write(base64.b64decode(os.environ['MACOS_CERTIFICATE']))"
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import /tmp/wisepet-cert.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
      - name: 打包
        # 签名/公证凭据来自仓库 secrets；未配置时各项为空，脚本自动跳过对应步骤。
        # WISEPET_NOTARIZE 必须是字面量 "1" 才触发公证，避免误提交空凭据。
        env:
          PYTHONIOENCODING: utf-8
          WISEPET_CODESIGN_IDENTITY: ${{ secrets.WISEPET_CODESIGN_IDENTITY }}
          WISEPET_NOTARIZE: ${{ secrets.WISEPET_NOTARIZE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: python tools/package.py --target ${{ matrix.target }}
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: WisePet-${{ matrix.target }}-${{ github.ref_name }}
          # 只上传当次生成的包文件：旧的 dist/WisePet-* 会把历史解压目录
          # 一并当成 artifact 上传，越积越大（真机「解压卡死」的成因之一）
          path: |
            dist/WisePet-*.zip
            dist/WisePet-*-setup.exe
            dist/WisePet-*.dmg
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    # 修改这里：允许手动触发(workflow_dispatch) 或 推送标签(push tags)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          pattern: WisePet-*
          merge-multiple: true
          path: dist/

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/WisePet-*.zip
            dist/WisePet-*-setup.exe
            dist/WisePet-*.dmg
          draft: false
          prerelease: false


