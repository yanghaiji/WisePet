name: release-os-artifact

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: python -m pip install -r dev-requirements.txt
      - name: 安装 NSIS（仅 Windows）
        if: matrix.target == 'windows'
        run: choco install nsis -y --no-progress
      # 签名/公证链路暂时停用（用户要求「先不启用密钥」）：CI 不注入任何
      # secrets、不导入证书，打包走纯路径，产出未签名 dmg。
      # 代码能力保留在 tools/package.py 的 sign_app/sign_dmg/notarize_dmg，
      # 以后有 Apple Developer 账号时，按 README「在 GitHub Actions 上出签名+
      # 公证的 Mac 包」一节把 env 与证书导入步骤加回来即可，无需改脚本。
      - name: 打包
        env:
          PYTHONIOENCODING: utf-8
        run: python tools/package.py --target ${{ matrix.target }}
      # 打包失败时打印产物清单与自检结果，便于从 Actions 日志直接定位，
      # 不必再靠「有没有 artifact」反推是哪一步挂了。
      - name: 打包失败诊断（仅失败时）
        if: failure()
        run: |
          echo "=== dist/ 内容 ==="
          ls -lah dist/ || true
          echo "=== 产物自检 ==="
          python tools/package.py --verify --target ${{ matrix.target }} || true
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: WisePet-${{ matrix.target }}-${{ github.ref_name }}
          # 只上传当次生成的包文件：旧的 dist/WisePet-* 会把历史解压目录
          # 一并当成 artifact 上传，越积越大（真机「解压卡死」的成因之一）
          path: |
            dist/WisePet-*.zip
            dist/WisePet-*-setup.exe
            dist/WisePet-*.dmg
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    # 修改这里：允许手动触发(workflow_dispatch) 或 推送标签(push tags)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          pattern: WisePet-*
          merge-multiple: true
          path: dist/

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/WisePet-*.zip
            dist/WisePet-*-setup.exe
            dist/WisePet-*.dmg
          draft: false
          prerelease: false


